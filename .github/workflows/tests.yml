name: Proves

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Baixa el codi
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instal·la FFmpeg i tipografies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Instal·la dependències
        run: pip install -r requirements.txt
      - name: Executa proves unitàries i renderitzat curt
        run: |
          set -o pipefail
          if ! python -m pytest -q -rfE 2>&1 | tee pytest.log; then
            # Mostra els errors com a anotacions perquè es vegen sense obrir el registre.
            grep -E "^(FAILED|ERROR) |^E  " pytest.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
