name: Proves

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa el codi
        uses: actions/checkout@v4
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instal·la dependències
        run: pip install -r requirements.txt
      - name: Executa les proves
        run: pytest -q
